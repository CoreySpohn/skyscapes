[build-system]
requires = ['hatchling', "hatch-fancy-pypi-readme", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "skyscapes"
description = "Astrophysical scene modeling for HWO direct imaging"
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
dynamic = ['readme', 'version']
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "exojax>=2.2",
    "hwoutils",
    "jax>=0.8.1",
    "jaxlib>=0.8.1",
    "optixstuff",
    "pooch",
    # exojax -> radis 0.17 -> vaex-core. vaex-core 4.19 has Linux py3.12
    # wheels but requires pandas<3; without this pin uv falls back to
    # vaex-core 4.17.1, which ships no py3.12 wheel and fails to build
    # from source (its setup.py imports the stdlib `imp` module, removed
    # in 3.12).
    'vaex-core>=4.19.0; python_version < "3.13"',
]
[project.optional-dependencies]
dev = ["pre-commit"]
docs = [
    "sphinx",
    "myst-nb",
    "sphinx-book-theme",
    "sphinx-autoapi",
    "sphinx_autodoc_typehints",
    "ipython",
    "matplotlib",
]
test = ["nox", "pytest", "hypothesis", "pytest-cov", "orbix", "exoverses"]

[project.urls]
Homepage = "https://github.com/CoreySpohn/skyscapes"
Issues = "https://github.com/CoreySpohn/skyscapes/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/skyscapes/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.pytest.ini_options]
markers = [
    "slow: requires network or heavy database downloads (e.g. ExoJAX line lists)",
]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.hatch.build.targets.wheel]
packages = ["src/skyscapes"]

[tool.hatch.build.targets.sdist]
exclude = ["/scripts", "/docs", "/tests", "/.github"]
