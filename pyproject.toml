[build-system]
requires = ['hatchling', "hatch-fancy-pypi-readme", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "skyscapes"
description = "Astrophysical scene modeling for HWO direct imaging"
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
dynamic = ['readme', 'version']
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy",
    "equinox",
    "exojax>=2.2",
    "hwoutils",
    "interpax",
    "jax>=0.8.1",
    "jaxlib>=0.8.1",
    "jaxtyping",
    "numpy",
    "orbix>=3.0.0",
    "pooch",
    "scipy",
    # exojax -> radis 0.17 -> vaex-core. vaex-core 4.19 has Linux py3.12
    # wheels but requires pandas<3; without this pin uv falls back to
    # vaex-core 4.17.1, which ships no py3.12 wheel and fails to build
    # from source (its setup.py imports the stdlib `imp` module, removed
    # in 3.12).
    'vaex-core>=4.19.0; python_version < "3.13"',
]
[project.optional-dependencies]
dev = ["pre-commit"]
docs = [
    "sphinx",
    "myst-nb",
    "sphinx-book-theme",
    "sphinx-autoapi",
    "sphinx_autodoc_typehints",
    "sphinxcontrib-mermaid",
    "ipython",
    "matplotlib",
    "eyepiece>=0.4.0",
]
# The viz tests import matplotlib and eyepiece, so the test extra carries the
# viz extra: without it those modules fail to import on a clean runner and the
# viz suite silently does not run.
test = [
    "pytest",
    "hypothesis",
    "ineedvalidation",
    "pytest-cov",
    "pytest-xdist",
    "pytest-testmon",
    "pytest-markdown-docs",
    "pytest-timeout",
    "pytest-fail-slow",
    "packaging",
    "orbix>=3.0.0",
    "exoverses",
    "skyscapes[viz]",
]
# skyscapes.viz draws through eyepiece (imshow_log, PlotResult, SourceStyles,
# ARTIST_KEYS) and resolves brand colors from hwostyle's Roles, which ship
# from hwostyle 1.4.0.
viz = ["eyepiece>=0.4.0", "hwostyle>=1.4.0", "matplotlib"]

[project.urls]
Homepage = "https://github.com/CoreySpohn/skyscapes"
Issues = "https://github.com/CoreySpohn/skyscapes/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/skyscapes/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # test functions / fixtures do not need docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.hatch.build.targets.wheel]
packages = ["src/skyscapes"]

[tool.hatch.build.targets.sdist]
exclude = ["/scripts", "/docs", "/tests", "/.github"]

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    # ExoJAX applies its line-opacity resolution threshold to continuum-only grids.
    'ignore:Resolution may be too small\. R=:UserWarning:exojax\.utils\.grids',
    # interpax cubic splines store float64 intermediates in float32 FITS cube tables.
    'ignore:scatter inputs have incompatible types\x3a cannot safely cast value from dtype=float64 to dtype=float32 with jax_numpy_dtype_promotion=standard\.:FutureWarning:jax\._src\.ops\.scatter',
    # HAPI, ExoJAX and Vaex use non-raw regexes/docstrings with invalid Python 3.12 escapes.
    'ignore:invalid escape sequence:SyntaxWarning:.*[/]site-packages[/](hapi[/]hapi|(exojax|vaex)[/].*)$',
    # ExoJAX redirects HAPI's import output to an unclosed /dev/null stream.
    "ignore:unclosed file.*name='/dev/null':ResourceWarning:exojax[.]database[.]_common[.]hitranapi$",
    # tol_colors initializes colormaps with Matplotlib's pending-deprecated set_bad.
    'ignore:The set_bad function will be deprecated in a future version\.:PendingDeprecationWarning:tol_colors$',
    # Vaex's expression formatter still checks deprecated ast.Num nodes on Python 3.12.
    'ignore:ast\.Num is deprecated and will be removed in Python 3\.14; use ast\.Constant instead:DeprecationWarning:vaex\.expresso$',  # codespell:ignore expresso
    # ExoJAX warns on nonpositive HITRAN temperature exponents even for its linear grid.
    'ignore:There exists negative or zero value\.$:UserWarning:exojax\.opacity\._common\.set_ditgrid$',
    # ExoJAX lacks King factors for several supported gases and defaults to 1.
    'ignore:No King correction factor found for molecule .* Using default value of 1\.0\. Modify by setting opa\.king_factor\.$:UserWarning:exojax\.opacity\.opacont$',
    # ExoJAX warns before skyscapes can apply its explicit N2O polarizability override.
    "ignore:No polarizability found for molecule 'N2O'[.] Set opa[.]polarizability manually[.]:UserWarning:exojax[.]opacity[.]opacont$",
]
markers = [
    "medium: tests with a 30-second default time budget",
    "slow: tests with a 300-second default time budget, run nightly",
]

[tool.testbudget]
library = "skyscapes"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["skyscapes"]
optional_dependencies_dev_groups = ["dev", "docs", "test"]

[tool.deptry.per_rule_ignores]
# JAX loads its compiled backend; keep the explicit minimum version constraint.
# vaex-core is constrained for exojax's transitive dependency to have Python 3.12 wheels.
DEP002 = ["jaxlib", "vaex-core"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/skyscapes"]
